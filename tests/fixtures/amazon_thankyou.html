<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon.in - Thank you, your order has been placed</title>
</head>
<body class="thankyou-page">
  <div id="thankYouDisplayPage" class="a-container">
    
    <div class="a-box a-alert a-alert-success" id="order-summary-box">
      <div class="a-box-inner a-alert-container">
        <h4 class="a-alert-heading">Order placed, thank you</h4>
        <div class="a-alert-content">
          <p>Confirmation will be sent to your email.</p>
        </div>
      </div>
    </div>

    <div id="thank-you-header">
      <h1 class="a-size-large a-text-bold">Thank you, your order has been placed.</h1>
      <p class="order-number-line">
        <strong>Order # <span class="order-id">402-1234567-1234567</span></strong>
      </p>
    </div>

    <div id="delivery-promise-summary">
      <p>Guaranteed delivery: <strong>Tomorrow by 9 PM</strong></p>
    </div>

    <div id="post-order-links">
      <a href="https://www.amazon.in/gp/css/order-history" id="view-orders-link">View or manage your orders</a>
      <a href="https://www.amazon.in/" id="continue-shopping-link">Continue shopping</a>
    </div>

  </div>
</body>
</html>
